services:
  postgres:
    image: postgres:16-alpine
    container_name: flow-postgres
    environment:
      POSTGRES_USER: flow
      POSTGRES_PASSWORD: flow
      POSTGRES_DB: flow
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - flow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flow -d flow"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  flow-pgdata:
