<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ReForge · 我的 — 设计稿 04-B</title>
<link rel="stylesheet" href="../liquid-glass/assets/tokens.css">
<link rel="stylesheet" href="console.css">
</head>
<body class="app">
<div id="root"></div>

<script src="icons.js"></script>
<script src="mock.js"></script>
<script>
(function () {
  "use strict";
  const M = window.Mock;
  const q = new URLSearchParams(location.search);
  const user = q.get("role") && M.USERS[q.get("role")] ? M.USERS[q.get("role")] : M.USERS.admin;

  // 「我的」是手机底部 Tab 的一页;桌面上这些入口都在侧栏底部,直接回工作台
  if (!document.body.classList.contains("mob")) {
    location.replace("workbench.html");
    return;
  }

  const row = ({ ic, tone = "", label, sub = "", href = "#todo:" + label }) =>
    `<a class="me-row" href="${href}"><span class="ti ${tone}">${M.icon(ic)}</span><span class="tx">${label}${sub ? `<small>${sub}</small>` : ""}</span>${M.icon("chevron-right")}</a>`;

  document.getElementById("root").innerHTML =
    M.WALLPAPER +
    `<div class="page">
      ${M.mTop({ user })}
      <header class="pg-head"><div class="pg-head-text"><h1>我的</h1></div></header>

      <section class="lg-card me-card">
        <span class="avatar lg ${user.av}">${user.name.slice(0, 1)}</span>
        <div class="who"><b>${user.name}</b><span>${user.dept} · @${user.username}</span>${M.badge(user.title, user.role === "admin" ? "amber" : "plain")}</div>
      </section>

      <p class="sb-group-label" style="padding-left:4px">工作空间</p>
      <section class="lg-card me-list">
        ${row({ ic: "presentation", label: "数据大屏", sub: "全公司流程的运行情况" })}
        ${row({ ic: "plus", tone: "green", label: "提交流程", sub: "申报一条需要再造的流程", href: "#todo:提交流程" })}
      </section>

      ${
        user.role === "admin"
          ? `<p class="sb-group-label" style="padding-left:4px">系统管理</p>
      <section class="lg-card me-list">${row({ ic: "settings", tone: "indigo", label: "管理后台", sub: "流程定义、系统库、用户与模板", href: "admin.html#/admin/processes" })}</section>`
          : ""
      }

      <p class="sb-group-label" style="padding-left:4px">账号</p>
      <section class="lg-card me-list">
        ${row({ ic: "user-round", tone: "gray", label: "个人信息", sub: "显示名、部门、修改密码", href: "#todo:个人信息" })}
        <a class="me-row danger" href="login.html"><span class="ti">${M.icon("log-out")}</span><span class="tx">退出登录</span></a>
      </section>
      <p class="caption" style="padding:12px 6px 0">登录会话 24 小时有效 · 退出后需重新登录</p>
    </div>` +
    M.mTabs({ active: "me", unread: 3, todo: 2 });
})();
</script>
</body>
</html>
