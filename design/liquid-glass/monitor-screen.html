<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReForge · Liquid Glass — 流程再造监控大屏(一期)</title>
<link rel="stylesheet" href="assets/tokens.css">
<style>
  /* ============ 暗色玻璃一期:仅三个核心数 ============ */
  :root {
    --m-bg: #0a0e1a;
    --m-ink: rgba(255, 255, 255, 0.92);
    --m-ink-2: rgba(255, 255, 255, 0.62);
    --m-ink-3: rgba(255, 255, 255, 0.38);
    --m-blue: #0a84ff;
    --m-cyan: #64d2ff;
    --m-green: #30d158;
  }
  html { color-scheme: dark; }
  body { background: var(--m-bg); color: var(--m-ink); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif; }

  .wallpaper {
    background:
      radial-gradient(64rem 44rem at 10% -12%, rgba(10, 132, 255, 0.24), transparent 60%),
      radial-gradient(54rem 38rem at 96% -6%, rgba(94, 92, 230, 0.18), transparent 58%),
      radial-gradient(60rem 42rem at 100% 108%, rgba(48, 209, 88, 0.1), transparent 55%),
      radial-gradient(48rem 34rem at -8% 110%, rgba(100, 210, 255, 0.12), transparent 55%),
      linear-gradient(180deg, #0b1020, #080c16);
  }
  .grid-dots { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.5;
    background-image: radial-gradient(rgba(255,255,255,0.07) 1px, transparent 1px); background-size: 26px 26px; }

  .stage2 { position: relative; z-index: 1; min-height: 100vh; max-width: 1560px; margin: 0 auto;
    padding: 34px 30px 30px; display: flex; flex-direction: column; }

  /* 顶栏 */
  .m-head { display: flex; align-items: center; gap: 14px; }
  .m-head .logo { display: flex; align-items: center; gap: 12px; }
  .m-head .logo .mk { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; color: #fff;
    background: linear-gradient(180deg, #409cff, #0a84ff); box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 8px 22px -6px rgba(10,132,255,0.8); }
  .m-head h1 { font: 700 26px/1 var(--font-sans); letter-spacing: 0.02em; }
  .m-head .sub { font: 400 12px/1 var(--font-sans); color: var(--m-ink-3); margin-top: 6px; letter-spacing: 0.24em; }
  .live { display: inline-flex; align-items: center; gap: 7px; padding: 8px 15px; border-radius: 980px;
    background: rgba(48,209,88,0.14); color: var(--m-green); font: 600 12px/1 var(--font-sans); }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: var(--m-green); box-shadow: 0 0 0 0 rgba(48,209,88,0.5); animation: pulse 2s infinite; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 9px rgba(48,209,88,0); } 100% { box-shadow: 0 0 0 0 rgba(48,209,88,0); } }
  .clock { margin-left: auto; text-align: right; }
  .clock .t { font: 700 30px/1 var(--font-sans); font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
  .clock .d { font: 400 12px/1 var(--font-sans); color: var(--m-ink-3); margin-top: 6px; font-variant-numeric: tabular-nums; }

  /* 三个核心数 */
  .trio { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; align-items: stretch; padding: 30px 0 8px; }
  @media (max-width: 860px) { .trio { grid-template-columns: 1fr; } }
  .kpi {
    position: relative; overflow: hidden;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    padding: 44px 24px 40px; border-radius: 32px;
    background: linear-gradient(180deg, rgba(255,255,255,0.09), rgba(255,255,255,0.04));
    -webkit-backdrop-filter: blur(28px) saturate(160%);
    backdrop-filter: blur(28px) saturate(160%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.16),
      inset 0 0 0 0.5px rgba(255,255,255,0.1),
      0 26px 60px -26px rgba(0,0,0,0.65);
  }
  .kpi .ring { position: absolute; top: -70px; width: 240px; height: 240px; border-radius: 50%; filter: blur(46px); opacity: 0.5; }
  .kpi.collect .ring { left: -60px; background: rgba(100, 210, 255, 0.4); }
  .kpi.following .ring { right: -60px; background: rgba(10, 132, 255, 0.45); }
  .kpi.done .ring { left: 50%; transform: translateX(-50%); background: rgba(48, 209, 88, 0.32); }

  .kpi .l { display: inline-flex; align-items: center; gap: 8px; font: 600 17px/1 var(--font-sans); color: var(--m-ink-2); letter-spacing: 0.06em; }
  .kpi .l i { width: 9px; height: 9px; border-radius: 50%; }
  .kpi .v { font-variant-numeric: tabular-nums; font-weight: 700; letter-spacing: -0.03em; line-height: 1; margin-top: 18px; font-size: clamp(88px, 9vw, 132px); }
  .kpi .sub { margin-top: 18px; font: 500 13px/1 var(--font-sans); color: var(--m-ink-3); }
  .kpi .sub b { font-weight: 600; }
  .collect .v { color: var(--m-cyan); }
  .following .v { color: #409cff; }
  .done .v { color: var(--m-green); }

  .foot { display: flex; align-items: center; gap: 10px; padding: 4px 6px 0; font: 400 12px/1 var(--font-sans); color: var(--m-ink-3); }
</style>
</head>
<body>
<div class="wallpaper" aria-hidden="true"></div>
<div class="grid-dots" aria-hidden="true"></div>

<div class="stage2">

  <header class="m-head">
    <div class="logo">
      <span class="mk">
        <svg style="width:20px;height:20px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="5" cy="6" r="2.4"/><circle cx="5" cy="18" r="2.4"/><circle cx="19" cy="12" r="2.4"/><path d="M7.3 6.9 16.7 11.1M7.3 17.1 16.7 12.9"/></svg>
      </span>
      <div>
        <h1>流程再造 · 运行监控大屏</h1>
        <div class="sub">REFORGE PROCESS REENGINEERING OVERVIEW</div>
      </div>
    </div>
    <span class="live" style="margin-left:20px"><i></i>实时</span>
    <div class="clock">
      <div class="t">14:32:08</div>
      <div class="d">2026-11-22 星期日 · 数据更新于 30 秒前</div>
    </div>
  </header>

  <!-- 一期:三个核心数 -->
  <div class="trio">
    <div class="kpi collect">
      <span class="ring" aria-hidden="true"></span>
      <span class="l"><i style="background:var(--m-cyan)"></i>累计收集流程</span>
      <span class="v">128</span>
      <span class="sub">本月新增 <b style="color:var(--m-ink)">26</b> 条</span>
    </div>
    <div class="kpi following">
      <span class="ring" aria-hidden="true"></span>
      <span class="l"><i style="background:#409cff"></i>跟进中</span>
      <span class="v">9</span>
      <span class="sub">含待验收 <b style="color:var(--m-ink)">4</b> · 待分析 <b style="color:var(--m-ink)">6</b> 另计</span>
    </div>
    <div class="kpi done">
      <span class="ring" aria-hidden="true"></span>
      <span class="l"><i style="background:var(--m-green)"></i>改造完成</span>
      <span class="v">96</span>
      <span class="sub">按期完成率 <b style="color:var(--m-green)">86%</b></span>
    </div>
  </div>

  <div class="foot">
    <span>一期口径:收集总数 = 前台累计提交;跟进中 = 状态「跟进中+待验收」;完成 = 管理员验收通过</span>
    <span style="margin-left:auto">趋势 / 负载 / 逾期等维度三期开放(完整版见 monitor-full.html)</span>
  </div>
</div>
</body>
</html>
