<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReForge · Liquid Glass — 02 会签编辑器(展开态)</title>
<link rel="stylesheet" href="assets/tokens.css">
<style>
  .page { max-width: 860px; margin: 0 auto; padding: 22px 28px 0; }

  .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin: 30px 4px 14px; }
  .sec-head h2 { font: var(--t-title2); letter-spacing: -0.02em; }

  .step { display: flex; gap: 10px; padding-bottom: 22px; }
  .step-body { flex: 1; min-width: 0; padding: 20px 22px;
    background: linear-gradient(180deg, rgba(255,246,231,0.52), rgba(255,243,224,0.36));
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.95),
      inset 0 0 0 0.5px rgba(255,255,255,0.6),
      inset 0 0 0 2px rgba(255,149,0,0.28),
      0 2px 6px -2px rgba(23,42,80,0.08),
      0 24px 56px -24px rgba(154,98,0,0.32);
  }
  .step-top { display: flex; align-items: center; gap: 10px; }
  .step-top .name { flex: 1; }
  .step-actions { display: flex; gap: 2px; flex-shrink: 0; }

  .attr { margin-top: 16px; display: grid; gap: 12px; }

  .party { padding: 14px 16px; }
  .party + .party { margin-top: 10px; }
  .party-head { display: flex; align-items: center; gap: 10px; }
  .party-head .dep { flex: 1; }

  .people { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

  .substep { background: rgba(255,255,255,0.62); border-radius: 14px; padding: 12px 14px;
    box-shadow: inset 0 0 0 0.5px rgba(255,255,255,0.7), inset 0 0 0 0.5px rgba(0,0,0,0.035); }
  .substep .sub-head { display: flex; align-items: center; gap: 8px; }
  .substep .no { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center;
    background: var(--amber-soft); color: var(--amber-deep); font: 700 12px/1 var(--font); transform: rotate(45deg); flex-shrink: 0; }
  .substep .no span { transform: rotate(-45deg); }
  .subrail { display: flex; gap: 7px; margin: 2px 0 10px 8px; }
  .subrail .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,149,0,0.4); margin-top: 4px; }
  .subrail .ln { flex: 1; min-height: 12px; width: 2px; border-radius: 2px; background: linear-gradient(180deg, rgba(255,149,0,0.4), rgba(255,149,0,0.12)); }

  .inline-row { display: flex; align-items: flex-end; gap: 12px; }
  .inline-row > * { flex: 1; }
  .inline-row .fix { flex: 0 0 auto; }

  .toolbar { display: flex; align-items: center; gap: 10px; }
  .pagefoot { text-align: center; padding: 8px 0 40px; }
</style>
</head>
<body>
<div class="wallpaper" aria-hidden="true">
  <div class="orb orb-1"></div><div class="orb orb-2"></div>
  <div class="orb orb-3"></div><div class="orb orb-4"></div>
  <div class="orb orb-5"></div><div class="orb orb-6"></div><div class="orb orb-7"></div>
</div>

<div class="stage">
  <div class="page">

    <header class="topbar lg-clear">
      <div class="brand">
        <span class="mark">
          <svg class="ic" style="font-size:16px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="5" cy="6" r="2.4"/><circle cx="5" cy="18" r="2.4"/><circle cx="19" cy="12" r="2.4"/><path d="M7.3 6.9 16.7 11.1M7.3 17.1 16.7 12.9"/></svg>
        </span>
        ReForge
      </div>
      <div class="spacer"></div>
      <button class="nav-action">
        <svg class="ic" style="font-size:15px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.3-2.9 7.3-7 9-4.1-1.7-7-4.7-7-9V6z"/><path d="M9.2 12l2 2 3.6-3.8"/></svg>
        管理后台
      </button>
    </header>

    <div class="sec-head">
      <h2>
        <svg class="ic" style="font-size:19px;color:var(--amber)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h9a3 3 0 1 0-3-3"/><path d="M4 12.5h13a3 3 0 1 1-3 3"/><path d="M4 17h6"/></svg>
        会签节点 · 各方并行办理
      </h2>
      <div class="toolbar">
        <button class="btn btn-glass" style="height:34px;padding:0 14px;font-size:13px">
          <svg class="ic" style="font-size:13px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9.5l6 6 6-6"/></svg>
          全部收起
        </button>
      </div>
    </div>

    <div class="step countersign">
      <div class="rail-col">
        <span class="rail-bead diamond"><span>2</span></span>
        <span class="rail-line"></span>
      </div>
      <div class="step-body lg-card">
        <div class="step-top">
          <input class="field name" value="预算与合规会签">
          <span class="badge amber"><span class="dot"></span>会签节点</span>
          <span class="badge warn"><span class="dot"></span>待完善 2</span>
          <div class="step-actions">
            <button class="icon-btn" aria-label="上移"><svg class="ic" style="font-size:15px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
            <button class="icon-btn" aria-label="下移"><svg class="ic" style="font-size:15px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button>
            <button class="icon-btn danger" aria-label="删除"><svg class="ic" style="font-size:15px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 15 5v2M6.5 7l1 12a2 2 0 0 0 2 1.8h5a2 2 0 0 0 2-1.8l1-12M10 11v6M14 11v6"/></svg></button>
          </div>
        </div>

        <div class="attr">
          <div class="group-row" style="padding:10px 16px;background:var(--amber-soft);box-shadow:inset 0 0 0 0.5px rgba(255,149,0,0.25);border-radius:14px">
            <svg class="ic" style="font-size:17px;color:var(--amber-deep)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h9a3 3 0 1 0-3-3"/><path d="M4 12.5h13a3 3 0 1 1-3 3"/><path d="M4 17h6"/></svg>
            <span class="grow" style="color:var(--amber-deep);font-weight:600">本步骤为会签<small class="caption" style="margin-left:8px;color:var(--amber-deep);opacity:.92">处理方式由各会签方的内部子步骤标注</small></span>
            <span class="switch on"></span>
          </div>

          <div>
            <div class="field-label" style="color:var(--amber-deep)">
              <svg class="ic" style="font-size:14px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 14.5 14 4l6 6-10.5 10.5H3.5z"/><path d="M12 6l6 6"/></svg>
              会签部门及人员 <span style="color:var(--ink-3);font-weight:400">并行办理,内部可含多步</span> <span class="req">*</span>
            </div>

            <!-- 会签方 1:财务部(展开,含线下子步骤) -->
            <div class="party party-pane">
              <div class="party-head">
                <span class="badge amber" style="flex:0 0 auto">会签方 1</span>
                <div class="dep field-wrap has-icon">
                  <svg class="lead-icon ic" style="font-size:15px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V6a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v15M4 21h13M15 10h3a2 2 0 0 1 2 2v9M8 8h3M8 12h3M8 16h3"/></svg>
                  <input class="field" value="财务部" style="background:rgba(255,255,255,0.75)">
                </div>
                <button class="icon-btn" aria-label="收起"><svg class="ic" style="font-size:15px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 14.5l6-6 6 6"/></svg></button>
              </div>

              <div class="people" style="margin:10px 0 0">
                <span class="caption">涉及人员</span>
                <span class="tag">王芳
                  <span class="x"><svg class="ic" style="font-size:10px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></span>
                </span>
                <span class="tag">李强
                  <span class="x"><svg class="ic" style="font-size:10px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></span>
                </span>
                <input class="field" style="width:170px;height:34px" placeholder="输入姓名后回车">
              </div>

              <div style="display:grid;gap:10px;margin-top:14px">
                <!-- 子步骤 1:线上 -->
                <div class="substep">
                  <div class="sub-head">
                    <span class="no"><span>1</span></span>
                    <input class="field" style="flex:1;height:38px" value="复核预算明细">
                    <span class="badge blue"><span class="dot"></span>线上</span>
                    <button class="icon-btn" style="width:28px;height:28px" aria-label="复制子步骤"><svg class="ic" style="font-size:13px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M5 15.5V6a2 2 0 0 1 2-2h8"/></svg></button>
                    <button class="icon-btn danger" style="width:28px;height:28px" aria-label="删除子步骤"><svg class="ic" style="font-size:13px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 15 5v2M6.5 7l1 12a2 2 0 0 0 2 1.8h5a2 2 0 0 0 2-1.8l1-12"/></svg></button>
                  </div>
                  <div class="inline-row" style="margin-top:10px">
                    <div class="field-wrap">
                      <input class="field" style="height:38px" value="费控系统">
                      <svg class="trail-chevron ic" style="font-size:12px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9.5l6 6 6-6"/></svg>
                    </div>
                    <div class="fix" style="display:flex;align-items:center;gap:10px">
                      <span class="caption" style="white-space:nowrap">移动端</span>
                      <div class="seg mini"><button class="on">是</button><button>否</button></div>
                    </div>
                  </div>
                </div>

                <!-- 子步骤 2:线下 -->
                <div class="substep">
                  <div class="sub-head">
                    <span class="no"><span>2</span></span>
                    <input class="field" style="flex:1;height:38px" value="登记预算台账并留存纸质凭证">
                    <span class="badge plain" style="background:rgba(52,199,89,0.14);color:var(--green-deep)">线下</span>
                    <button class="icon-btn" style="width:28px;height:28px" aria-label="复制子步骤"><svg class="ic" style="font-size:13px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M5 15.5V6a2 2 0 0 1 2-2h8"/></svg></button>
                    <button class="icon-btn danger" style="width:28px;height:28px" aria-label="删除子步骤"><svg class="ic" style="font-size:13px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 15 5v2M6.5 7l1 12a2 2 0 0 0 2 1.8h5a2 2 0 0 0 2-1.8l1-12"/></svg></button>
                  </div>
                  <div style="display:grid;gap:12px;margin-top:12px">
                    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
                      <span class="tag">预算登记表
                        <span class="x"><svg class="ic" style="font-size:10px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></span>
                      </span>
                      <span class="tag">原始凭证
                        <span class="x"><svg class="ic" style="font-size:10px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></span>
                      </span>
                      <input class="field" style="flex:1;min-width:180px;height:38px" placeholder="涉及文件名称,回车添加">
                    </div>
                    <div class="inline-row">
                      <div class="field-wrap has-icon">
                        <svg class="lead-icon ic" style="font-size:15px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V6a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v15M4 21h13M15 10h3a2 2 0 0 1 2 2v9M8 8h3M8 12h3M8 16h3"/></svg>
                        <input class="field" style="height:38px" value="财务部 · 王芳">
                        <svg class="trail-chevron ic" style="font-size:12px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9.5l6 6 6-6"/></svg>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <button class="btn btn-glass" style="height:34px;padding:0 14px;font-size:13px;margin-top:12px;color:var(--amber-deep)">
                <svg class="ic" style="font-size:13px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                添加内部子步骤
              </button>
            </div>

            <!-- 会签方 2:法务部(展开,含数据互通追问) -->
            <div class="party party-pane">
              <div class="party-head">
                <span class="badge amber" style="flex:0 0 auto">会签方 2</span>
                <div class="dep field-wrap has-icon">
                  <svg class="lead-icon ic" style="font-size:15px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V6a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v15M4 21h13M15 10h3a2 2 0 0 1 2 2v9M8 8h3M8 12h3M8 16h3"/></svg>
                  <input class="field" value="法务部" style="background:rgba(255,255,255,0.75)">
                </div>
                <button class="icon-btn" aria-label="收起"><svg class="ic" style="font-size:15px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 14.5l6-6 6 6"/></svg></button>
              </div>

              <div class="people" style="margin:10px 0 0">
                <span class="caption">涉及人员</span>
                <span class="tag">赵敏
                  <span class="x"><svg class="ic" style="font-size:10px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></span>
                </span>
                <input class="field" style="width:170px;height:34px" placeholder="输入姓名后回车">
              </div>

              <div style="display:grid;gap:10px;margin-top:14px">
                <!-- 子步骤 1:线上,与上一步不同系统 → 数据互通追问 -->
                <div class="substep">
                  <div class="sub-head">
                    <span class="no"><span>1</span></span>
                    <input class="field" style="flex:1;height:38px" value="合同合规性审查">
                    <span class="badge blue"><span class="dot"></span>线上</span>
                  </div>
                  <div style="display:grid;gap:10px;margin-top:10px">
                    <div class="inline-row">
                      <div class="field-wrap">
                        <input class="field" style="height:38px" value="合同管理系统">
                        <svg class="trail-chevron ic" style="font-size:12px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9.5l6 6 6-6"/></svg>
                      </div>
                      <div class="fix" style="display:flex;align-items:center;gap:10px">
                        <span class="caption" style="white-space:nowrap">移动端</span>
                        <div class="seg mini"><button class="on">是</button><button>否</button></div>
                      </div>
                    </div>
                    <!-- 相邻不同系统 → 追问数据互通 -->
                    <div style="display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;background:rgba(0,113,227,0.07);box-shadow:inset 0 0 0 0.5px rgba(0,113,227,0.18)">
                      <svg class="ic" style="font-size:15px;color:var(--tint)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12h8M8 12l2.5-2.5M8 12l2.5 2.5M16 12l-2.5-2.5M16 12l-2.5 2.5"/><circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg>
                      <span class="footnote" style="color:var(--tint-deep)">「OA 协同办公平台 → 合同管理系统」数据互通 <span style="color:var(--red)">*</span></span>
                      <div class="seg mini" style="margin-left:auto"><button class="on">是</button><button>否</button></div>
                    </div>
                  </div>
                </div>
              </div>

              <button class="btn btn-glass" style="height:34px;padding:0 14px;font-size:13px;margin-top:12px;color:var(--amber-deep)">
                <svg class="ic" style="font-size:13px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                添加内部子步骤
              </button>
            </div>

            <!-- 会签方 3:折叠态摘要 -->
            <div class="party party-pane" style="padding:10px 16px">
              <div class="party-head">
                <span class="badge amber" style="flex:0 0 auto">会签方 3</span>
                <div class="dep" style="font:var(--t-subhead);color:var(--ink-2)">
                  主管副总 · 1 人 · 1 个子步骤
                  <span class="badge ok" style="margin-left:8px;height:20px"><span class="dot"></span>就绪</span>
                </div>
                <button class="icon-btn" aria-label="展开"><svg class="ic" style="font-size:15px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 6l6 6-6 6"/></svg></button>
              </div>
            </div>

            <button class="btn btn-glass" style="height:38px;padding:0 16px;font-size:14px">
              <svg class="ic" style="font-size:14px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
              添加会签方
            </button>
          </div>
        </div>
      </div>
    </div>

    <p class="pagefoot caption">概念稿 02 / 06 · 会签编辑器 — 各方并行办理,内部子步骤串联 · Liquid Glass</p>
  </div>
</div>
</body>
</html>
