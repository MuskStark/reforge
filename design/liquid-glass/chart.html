<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReForge · Liquid Glass — 03 流程图弹窗</title>
<link rel="stylesheet" href="assets/tokens.css">
<style>
  /* 背后是被压暗的编辑页骨架(scrim 会再模糊一层) */
  .ghost { position: fixed; inset: 0; z-index: 0; }
  .ghost .skel { max-width: var(--content); margin: 120px auto; padding: 0 28px; display: grid; gap: 26px; }
  .ghost .sk { height: 200px; border-radius: 26px; background: rgba(255,255,255,0.4); }

  .sheet-head { display: flex; align-items: center; gap: 14px; padding: 22px 24px 16px; }
  .sheet-head h2 { font: var(--t-title3); letter-spacing: -0.02em; display: flex; align-items: center; gap: 10px; }
  .legend { display: flex; gap: 6px; margin-left: auto; }
  .sheet-body { flex: 1; overflow: auto; padding: 4px 20px 8px; }
  .sheet-foot {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 24px 18px;
    box-shadow: inset 0 0.5px 0 rgba(60,60,67,0.1);
  }
  .sheet-foot .note { font: var(--t-footnote); color: var(--ink-2); display: flex; align-items: center; gap: 7px; }
  .sheet-foot .actions { margin-left: auto; display: flex; gap: 10px; }

  text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
</style>
</head>
<body>
<div class="wallpaper" aria-hidden="true">
  <div class="orb orb-1"></div><div class="orb orb-2"></div>
  <div class="orb orb-3"></div><div class="orb orb-4"></div>
</div>

<!-- 被弹窗压住的编辑页骨架 -->
<div class="ghost stage" aria-hidden="true">
  <div class="skel"><div class="sk"></div><div class="sk" style="height:320px"></div><div class="sk" style="height:260px"></div></div>
</div>

<div class="scrim">
  <div class="sheet" role="dialog" aria-label="流程图预览">
    <div class="sheet-head">
      <h2>
        <svg class="ic" style="font-size:19px;color:var(--tint)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="5.5" r="2"/><circle cx="6" cy="18.5" r="2"/><circle cx="18" cy="12" r="2"/><path d="M8 6.3 16 11M8 17.7 16 13"/></svg>
        流程图 — 采购申请审批流程
      </h2>
      <div class="legend">
        <span class="badge blue"><span class="dot"></span>线上</span>
        <span class="badge plain" style="background:var(--green-soft);color:var(--green-deep)"><span class="dot" style="background:var(--green)"></span>线下</span>
        <span class="badge amber"><span class="dot"></span>会签</span>
        <span class="badge indigo">- -&nbsp;▶&nbsp;前置依赖</span>
      </div>
      <button class="icon-btn" aria-label="关闭" style="width:34px;height:34px;box-shadow:inset 0 0 0 0.5px rgba(0,0,0,0.08);background:rgba(255,255,255,0.7)">
        <svg class="ic" style="font-size:14px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>

    <div class="sheet-body">
      <svg viewBox="0 0 860 712" style="width:100%;height:auto;display:block" role="img" aria-label="采购申请审批流程图">
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" fill="#8a97ab"/>
          </marker>
          <marker id="arIn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" fill="#5856d6"/>
          </marker>
          <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#172a54" flood-opacity="0.14"/>
          </filter>
        </defs>

        <!-- 主干箭头 -->
        <g stroke="#8a97ab" stroke-width="1.7" fill="none">
          <path d="M430 60 V 92" marker-end="url(#ar)"/>
          <path d="M430 144 V 172" marker-end="url(#ar)"/>
          <path d="M430 255 V 266" />
          <path d="M430 266 H 160 V 271" marker-end="url(#ar)"/>
          <path d="M430 266 V 271" marker-end="url(#ar)"/>
          <path d="M430 266 H 700 V 271" marker-end="url(#ar)"/>
          <!-- 汇聚 -->
          <path d="M160 439 V 468"/>
          <path d="M430 374 V 468"/>
          <path d="M700 374 V 468"/>
          <path d="M160 468 H 700"/>
          <path d="M430 468 V 491" marker-end="url(#ar)"/>
          <path d="M430 541 V 566" marker-end="url(#ar)"/>
          <path d="M430 618 V 642" marker-end="url(#ar)"/>
        </g>

        <!-- 开始 -->
        <rect x="362" y="22" width="136" height="38" rx="19" fill="#1d1d1f" filter="url(#ds)"/>
        <text x="430" y="46" text-anchor="middle" font-size="13.5" font-weight="600" fill="#fff">开 始</text>

        <!-- 提交申请(线上) -->
        <g filter="url(#ds)">
          <rect x="335" y="92" width="190" height="52" rx="15" fill="rgba(255,255,255,0.95)" stroke="#007aff" stroke-width="1.6"/>
        </g>
        <circle cx="361" cy="118" r="4" fill="#007aff"/>
        <text x="438" y="115" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1d1f">提交申请</text>
        <text x="438" y="133" text-anchor="middle" font-size="11" fill="#6e6e73">线上 · OA 协同办公平台</text>

        <!-- 会签菱形 -->
        <g filter="url(#ds)">
          <path d="M430 176 L508 217 L430 258 L352 217 Z" fill="#fff5e3" stroke="#ff9500" stroke-width="1.7"/>
        </g>
        <text x="430" y="213" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9a6200">预算与合规</text>
        <text x="430" y="230" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9a6200">会 签</text>

        <!-- 会签方 A:财务部 -->
        <g filter="url(#ds)">
          <rect x="76" y="271" width="168" height="30" rx="15" fill="rgba(255,149,0,0.16)" stroke="#ff9500" stroke-width="1.1"/>
        </g>
        <text x="160" y="291" text-anchor="middle" font-size="12.5" font-weight="600" fill="#9a6200">财务部 · 2 人</text>
        <path d="M160 301 V 324" stroke="#8a97ab" stroke-width="1.7" fill="none" marker-end="url(#ar)"/>
        <g filter="url(#ds)">
          <rect x="55" y="328" width="210" height="46" rx="13" fill="rgba(255,255,255,0.95)" stroke="#007aff" stroke-width="1.5"/>
        </g>
        <text x="160" y="347" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d1d1f">复核预算明细</text>
        <text x="160" y="363" text-anchor="middle" font-size="10.5" fill="#6e6e73">线上 · 费控系统</text>
        <path d="M160 374 V 391" stroke="#8a97ab" stroke-width="1.7" fill="none" marker-end="url(#ar)"/>
        <g filter="url(#ds)">
          <rect x="55" y="395" width="210" height="44" rx="13" fill="rgba(255,255,255,0.95)" stroke="#34c759" stroke-width="1.5"/>
        </g>
        <text x="160" y="413" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d1d1f">登记预算台账</text>
        <text x="160" y="429" text-anchor="middle" font-size="10.5" fill="#6e6e73">线下 · 财务部</text>

        <!-- 会签方 B:法务部 -->
        <g filter="url(#ds)">
          <rect x="346" y="271" width="168" height="30" rx="15" fill="rgba(255,149,0,0.16)" stroke="#ff9500" stroke-width="1.1"/>
        </g>
        <text x="430" y="291" text-anchor="middle" font-size="12.5" font-weight="600" fill="#9a6200">法务部 · 1 人</text>
        <path d="M430 301 V 324" stroke="#8a97ab" stroke-width="1.7" fill="none" marker-end="url(#ar)"/>
        <g filter="url(#ds)">
          <rect x="325" y="328" width="210" height="46" rx="13" fill="rgba(255,255,255,0.95)" stroke="#007aff" stroke-width="1.5"/>
        </g>
        <text x="430" y="347" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d1d1f">合同合规性审查</text>
        <text x="430" y="363" text-anchor="middle" font-size="10.5" fill="#6e6e73">线上 · 合同管理系统</text>

        <!-- 会签方 C:主管副总 -->
        <g filter="url(#ds)">
          <rect x="616" y="271" width="168" height="30" rx="15" fill="rgba(255,149,0,0.16)" stroke="#ff9500" stroke-width="1.1"/>
        </g>
        <text x="700" y="291" text-anchor="middle" font-size="12.5" font-weight="600" fill="#9a6200">主管副总 · 1 人</text>
        <path d="M700 301 V 324" stroke="#8a97ab" stroke-width="1.7" fill="none" marker-end="url(#ar)"/>
        <g filter="url(#ds)">
          <rect x="595" y="328" width="210" height="46" rx="13" fill="rgba(255,255,255,0.95)" stroke="#007aff" stroke-width="1.5"/>
        </g>
        <text x="700" y="347" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d1d1f">审批签批</text>
        <text x="700" y="363" text-anchor="middle" font-size="10.5" fill="#6e6e73">线上 · OA 协同办公平台</text>

        <!-- 分管领导审批(线上,受依赖) -->
        <g filter="url(#ds)">
          <rect x="335" y="492" width="190" height="49" rx="15" fill="rgba(255,255,255,0.95)" stroke="#007aff" stroke-width="1.6"/>
        </g>
        <circle cx="361" cy="516" r="4" fill="#007aff"/>
        <text x="440" y="513" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1d1f">分管领导审批</text>
        <text x="440" y="530" text-anchor="middle" font-size="11" fill="#6e6e73">线上 · OA 协同办公平台</text>

        <!-- 纸质合同归档(线下) -->
        <g filter="url(#ds)">
          <rect x="335" y="567" width="190" height="51" rx="15" fill="rgba(255,255,255,0.95)" stroke="#34c759" stroke-width="1.6"/>
        </g>
        <circle cx="361" cy="592" r="4" fill="#34c759"/>
        <text x="440" y="590" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1d1f">纸质合同归档</text>
        <text x="440" y="607" text-anchor="middle" font-size="11" fill="#6e6e73">线下 · 行政部</text>

        <!-- 结束 -->
        <rect x="362" y="646" width="136" height="38" rx="19" fill="#1d1d1f" filter="url(#ds)"/>
        <text x="430" y="670" text-anchor="middle" font-size="13.5" font-weight="600" fill="#fff">结 束</text>

        <!-- 前置依赖:会签 → 分管领导审批(虚线) -->
        <path d="M508 217 C 640 240, 668 380, 534 508" stroke="#5856d6" stroke-width="1.8" fill="none" stroke-dasharray="5 5" marker-end="url(#arIn)"/>
        <g filter="url(#ds)">
          <rect x="726" y="417" width="128" height="27" rx="13.5" fill="rgba(88,86,214,0.1)"/>
        </g>
        <text x="790" y="435" text-anchor="middle" font-size="12" font-weight="600" fill="#4644c8">会签通过后执行</text>
      </svg>
    </div>

    <div class="sheet-foot">
      <div class="note">
        <svg class="ic" style="font-size:14px;color:var(--ink-3)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4.5M12 16h.01"/></svg>
        会签自动展开为菱形分叉 → 各方并行 → 汇聚;源码可二次编辑
      </div>
      <div class="actions">
        <button class="btn btn-glass">
          <svg class="ic" style="font-size:15px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M5 15.5V6a2 2 0 0 1 2-2h8"/></svg>
          复制 Mermaid 源码
        </button>
        <button class="btn btn-primary">关 闭</button>
      </div>
    </div>
  </div>
</div>

<p class="caption" style="position:fixed;left:0;right:0;bottom:12px;text-align:center;z-index:90">概念稿 03 / 06 · 流程图弹窗 — Liquid Glass</p>
</body>
</html>
