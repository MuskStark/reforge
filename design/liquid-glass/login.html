<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReForge · Liquid Glass — 06 管理后台登录</title>
<link rel="stylesheet" href="assets/tokens.css">
<style>
  .center {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 40px 20px;
  }
  .auth { width: 400px; padding: 34px 30px 28px; text-align: center; }
  .auth .mark-lg {
    width: 64px; height: 64px; margin: 0 auto 18px; display: grid; place-items: center;
    border-radius: 18px; color: #fff;
    background: linear-gradient(180deg, var(--tint-hi), var(--tint));
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), inset 0 -10px 18px -12px rgba(0,45,110,0.5), 0 10px 26px -10px rgba(0,113,227,0.65);
  }
  .auth h1 { font: var(--t-title2); letter-spacing: -0.02em; }
  .auth .sub { font: var(--t-footnote); color: var(--ink-2); margin-top: 6px; }

  .seg-wrap { margin: 22px 0 18px; }
  .seg-wrap .seg button { height: 36px; font-size: 14px; }

  .fields { display: grid; gap: 13px; text-align: left; }
  .btn-primary.full { width: 100%; height: 50px; font-size: 17px; margin-top: 20px; }

  .footnote-links { margin-top: 18px; display: flex; flex-direction: column; gap: 7px; }
  .footnote-links .back { color: var(--tint); text-decoration: none; font: var(--t-footnote); display: inline-flex; align-items: center; gap: 5px; justify-content: center; }

  .hint-box {
    margin-top: 16px; display: flex; gap: 8px; align-items: flex-start; text-align: left;
    padding: 11px 13px; border-radius: 14px; background: rgba(0,113,227,0.07);
    box-shadow: inset 0 0 0 0.5px rgba(0,113,227,0.16);
  }
  .hint-box p { font: 400 12.5px/1.5 var(--font); color: var(--tint-deep); }

  .pagefoot { position: fixed; left: 0; right: 0; bottom: 16px; text-align: center; }
</style>
</head>
<body>
<div class="wallpaper" aria-hidden="true">
  <div class="orb orb-1"></div><div class="orb orb-2"></div>
  <div class="orb orb-3"></div><div class="orb orb-4"></div>
</div>

<div class="stage center">
  <div class="auth lg-card">
    <div class="mark-lg">
      <svg class="ic" style="font-size:34px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="6" r="2.4"/><circle cx="5" cy="18" r="2.4"/><circle cx="19" cy="12" r="2.4"/><path d="M7.3 6.9 16.7 11.1M7.3 17.1 16.7 12.9"/></svg>
    </div>
    <h1>管理后台</h1>
    <p class="sub">ReForge · 流程再造工程收集表</p>

    <div class="seg-wrap">
      <div class="seg">
        <button class="on">登录</button>
        <button>注册</button>
      </div>
    </div>

    <div class="fields">
      <div>
        <div class="field-label">账号</div>
        <div class="field-wrap has-icon">
          <svg class="lead-icon ic" style="font-size:16px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c1.2-3.4 3.8-5 7-5s5.8 1.6 7 5"/></svg>
          <input class="field" placeholder="请输入账号">
        </div>
      </div>
      <div>
        <div class="field-label">密码</div>
        <div class="field-wrap has-icon">
          <svg class="lead-icon ic" style="font-size:16px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="9.5" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5M12 14.5v2"/></svg>
          <input class="field" type="password" placeholder="请输入密码">
        </div>
      </div>
    </div>

    <button class="btn btn-primary full">登 录</button>

    <div class="hint-box">
      <svg class="ic" style="font-size:15px;color:var(--tint);margin-top:1px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4.5M12 16h.01"/></svg>
      <p>首个注册用户自动成为管理员;此后公开注册关闭,账号一律由管理员在后台创建。登录会话 24 小时有效。</p>
    </div>

    <div class="footnote-links">
      <a class="back" href="#">
        <svg class="ic" style="font-size:13px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 6l-6 6 6 6"/></svg>
        返回流程收集表
      </a>
    </div>
  </div>
</div>

<p class="pagefoot caption">概念稿 06 / 06 · 管理后台登录 — Liquid Glass</p>
</body>
</html>
