# ReForge 生产部署编排：PostgreSQL + Go 后端 + Next.js 前端
# 用法：bash deploy.sh（详见 deploy.sh / README）
# 说明：与开发用 docker-compose.yml 相互独立（项目名 flow-prod），互不影响

name: flow-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: flow-prod-postgres
    environment:
      POSTGRES_USER: flow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在部署目录 .env 设置强口令}
      POSTGRES_DB: flow
      TZ: Asia/Shanghai
    volumes:
      - flow-prod-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flow -d flow"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build:
      context: ./backend
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
        ALPINE_MIRROR: ${ALPINE_MIRROR:-mirrors.tuna.tsinghua.edu.cn}
        GOLANG_IMAGE: ${GOLANG_IMAGE:-golang:1.27-alpine}
        ALPINE_IMAGE: ${ALPINE_IMAGE:-alpine:3.20}
    container_name: flow-prod-backend
    environment:
      # 容器网络内指向 postgres 服务
      DATABASE_URL: postgres://flow:${POSTGRES_PASSWORD}@postgres:5432/flow?sslmode=disable
      FLOW_ADDR: 0.0.0.0:8080
      # F04:管理员凭据强制外部注入,弱默认不再随生产生效
      FLOW_ADMIN_USER: ${FLOW_ADMIN_USER:-admin}
      FLOW_ADMIN_PASS: ${FLOW_ADMIN_PASS:?请在部署目录 .env 设置管理员强口令}
      # 外部通知(群机器人 / 邮件)末尾附带的站点地址,例如 http://reforge.example.internal:3000;不设则消息里不带链接
      FLOW_PUBLIC_URL: ${FLOW_PUBLIC_URL:-}
      TZ: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
    # 如需宿主机直连后端 API，取消下行注释
    # ports:
    #   - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
    container_name: flow-prod-frontend
    environment:
      BACKEND_ORIGIN: http://backend:8080
      TZ: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  flow-prod-pgdata:
